<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="skull-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g fill="none" stroke="#ff2222" stroke-width="2.5" filter="url(#skull-glow)">
    <!-- Cranium -->
    <path d="M 22 45 C 22 24, 34 16, 50 16 C 66 16, 78 24, 78 45 C 78 58, 72 65, 68 70 L 68 78 L 32 78 L 32 70 C 28 65, 22 58, 22 45 Z" fill="#140606" />
    <!-- Teeth -->
    <line x1="41" y1="78" x2="41" y2="87" stroke="#ff2222" stroke-width="2" />
    <line x1="50" y1="78" x2="50" y2="87" stroke="#ff2222" stroke-width="2" />
    <line x1="59" y1="78" x2="59" y2="87" stroke="#ff2222" stroke-width="2" />
    <path d="M 36 87 L 64 87" stroke="#ff2222" stroke-width="2" />
    <!-- Eye sockets -->
    <ellipse cx="38" cy="46" rx="7" ry="9" fill="#000" stroke="#ff4444" stroke-width="2" />
    <ellipse cx="62" cy="46" rx="7" ry="9" fill="#000" stroke="#ff4444" stroke-width="2" />
    <!-- Nasal cavity -->
    <polygon points="50,56 46,65 54,65" fill="#ff2222" />
  </g>
</svg>
